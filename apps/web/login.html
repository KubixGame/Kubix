<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вход | Kubix</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="auth-page">
      <form class="auth-card" id="login-form">
        <h1>Войти в Kubix</h1>
        <label>Логин <input name="username" required /></label>
        <label>Пароль <input name="password" type="password" required /></label>
        <button class="button primary" type="submit">Войти</button>
        <p id="login-status" class="status"></p>
        <p>Нет аккаунта? <a href="./register.html">Зарегистрироваться</a></p>
      </form>
    </main>
    <script type="module" src="./scripts/login.js"></script>
  </body>
  </html>
